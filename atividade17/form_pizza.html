<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Pizza</title>
</head>
<body>
    
    <table border="" align="center" width="90%">
        <tr>
            <td>
                <hr size="40" width="" style="background-image: linear-gradient(to right, maroon, tomato);"/>
            </td>
        </tr>
        <tr>
             <td valign="middle">
                <img src="icone_pizza.gif" alt="icone_pizza"> 
                <font face="verdana" color="maroon" size="3">Cadastre-se e receba nossas atualizações</font>
                <hr size="2" color="maroon" widht 90%>
                <form>
                    <table border="" align="center" width="50%">
                        <tr>
                            <td align="right" valign="middle" width="25%">
                                <label for="nome"></label><font  face="verdana" color="maroon" size="3">Nome:</font></label>
                            </td>
                            <td width="25%">
                                <input name="nome" type="text">
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="middle">
                                <label for="senha"><font  face="verdana" color="maroon" size="3">Senha:</font></label>
                            </td>
                            <td>
                                <input name="senha" type="password">
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="middle">
                                <label for="confirm_senha"><font  face="verdana" color="maroon" size="3">Confirmação da senha:</font></label>
                            </td>
                            <td >
                                <input name="confirm_senha" type="password">
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="middle">
                                <label for="tipo_pizza"><font  face="verdana" color="maroon" size="3">Seu tipo de pizza preferido:</font></label>
                            </td>
                            <td>
                                <select name="tipo_pizza">
                                    <option value="Margherita">Margherita</option>
                                    <option value="Mussarela">Mussarela</option>
                                    <option value="Portuguesa">Portuguesa</option>
                                    <option value="Calabresa">Calabresa</option>
                                    <option value="California">California</option>
                                    <option value="Pepperoni">Pepperoni</option>
                                    <option value="Quatro_queijos">Quatro queijos</option>
                                    <option value="Bacon">Bacon</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="middle">
                                <label for="pizza_frec"><font  face="verdana" color="maroon" size="3">Quantas vezes come Pizza por semestre:</font></label>
                            </td>
                            <td align="left">
                                <input name="pizza_frec" type="radio" value="1-5"> <font  face="verdana" color="maroon" size="3">Entre 1 a 5</font> <br/>
                                <input name="pizza_frec" type="radio" value="5-10"> <font  face="verdana" color="maroon" size="3">Entre 5 a 10</font> <br/>
                                <input name="pizza_frec" type="radio" value="+10"> <font  face="verdana" color="maroon" size="3">Mais de 10</font>
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="middle">
                                <label for="comentarios"><font  face="verdana" color="maroon" size="3">Comentários:</font></label>
                            </td>     
                            <td>
                                <textarea name="coment" cols="35" rows="5"></textarea>
                            </td>
                        </tr>
                        <tr align="center" valign="middle">
                            <td colspan="2">
                                <input type="checkbox"> <font  face="verdana" color="maroon" size="3">Deseja receber e-mais dos nossos parceiros</font>
                            </td>
                        </tr>
                        <tr align="center" valing="middle">
                            <td colspan="2"> 
                                <input type="submit" value="Enviar">
                                <input type="reset" value="Limpar">
                            </td>
                        </tr>
                    </table>
                </form>
                <hr size="2" color="maroon" widht 90%>
            </td>
        </tr>
        <tr>
             <td align="center" valing="middle">
                <font face="verdana" size="3" color="maroon"><ins>w w w . p i z z a o n l i n e . c o m . b r</ins></font>
            </td>
        </tr>
        <tr>
            <td>
                <hr size="40" width="" style="background-image: linear-gradient(to right, maroon, tomato);"/>
            </td>
        </tr>
    </table>  

</body>
</html>
