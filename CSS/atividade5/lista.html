<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="lista.css"/>
</head>
<body>
    <h2>Demonstração do uso de listas com HTML e CSS</h2>
    <hr/>
    <p>Listas não ordenadas:</p>
    <ul class="square">
        <li>ICC</li>
        <li>IPW</li>
        <li>SO</li>
    </ul>
    <ul class="circle">
        <li>ICC</li>
        <li>IPW</li>
        <li>SO</li>
    </ul>
    <ul>
        <li>ICC</li>
        <li>IPW</li>
        <li>SO</li>
    </ul>
    <ul class="seta">
        <li>ICC</li>
        <li>IPW</li>
        <li>SO</li>
    </ul>
    <p>Listas ordenadas:</p>
    <ol>
        <li>ICC</li>
        <li>IPW</li>
        <li>SO</li>
    </ol>
    <ol class="roman">
        <li>ICC</li>
        <li>IPW</li>
        <li>SO</li>
    </ol>
    <ol class="alpha">
        <li>ICC</li>
        <li>IPW</li>
        <li>SO</li>
    </ol>
</body>
</html>
