<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-body-secondary">
    <nav class="navbar navbar-expand-lg bg-success p-3 mb-3">
        <a class="navbar-brand fw-bold text-white" href="#">SELETIV@</A>
    </nav>

    <main class="container col-12 col-md-6">
        <div class="card shadow bg-white rounded">
            <div class="card-body">
                <h2 class="text-success mb-3">Nova empresa</h2>
                <hr/>
                <form>
                    <div class="row justify-content-center">
                        <div class="col-md">
                            <div class="mb-3">
                                <label type="text" for="nome_empresa" class="form-label" >Nome:</label>                                    <input type="text" id="nome_empresa" class="form-control" placeholder="Digite seu nome..."/>
                            </div>
                        </div>
                        <div class="col-md">
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail:</label>
                                <input type="email" id="email" class="form-control" placeholder="email@gmail.com"/>
                            </div>
                        </div>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-md">
                            <div class="mb-3">
                                <label for="cidade" class="form-label">Cidade:</label>
                                <input type="text" id="cidade" class="form-control" placeholder="Digite a cidade da empresa..."/>
                            </div>
                        </div>
                        <div class="col-md">
                            <div class="mb-3">
                                <label for="endereco" class="form-label">Endereço:</label>
                                <input type="text" id="endereco" class="form-control" placeholder="Rua..."/>
                            </div>
                        </div>
                    </div>


                        
                    <div class="mb-3">
                        <label for="nicho_mercado" class="form-label">Nicho de mercado:</label>
                        <input type="text" id="nicho_mercado" class="form-control" placeholder="Marketing"/>
                    </div>
                        
                    <div class="mb-3"> 
                        <label for="tecnologias" class="form-label">Tecnologias utilizadas</label>
                        <textarea id="tecnologias" class="form-control"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="caracteristicas_empresa" class="form-label">Características da empresa:</label>
                          <textarea id="caracteristicas_empresa" class="form-control"></textarea>
                     </div>

                    <div class="mb-3">
                        <label for="logo_img" class="form-label">Logo</label>
                        <input type="file" id="logo_img" class="form-control"/>
                   </div>
                
                   <button class="btn btn-success text-white">Nova empresa</button>

                </form>
            </div>
        </div>
        
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
