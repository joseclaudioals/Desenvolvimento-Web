<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Insira um valor numerico</p>
    <input type="number" min="1" id="degree">
    <button onclick = "
        let n = document.getElementById('degree').value;
        n = parseInt(n);
        let rad = 3.1415 * n / 180;
        document.getElementById('rad').innerHTML = rad;
    ">Ver em radianos</button>

    <p>Radianos: <span id="rad"></span></p>
</body>
</html>
