<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" min="1" id="n">
    <button onclick="f()">Aperte</button>
    <p>proximos 10 pares subsequentes <br/> <span id="numeros"></span></p>


    <script>
        function f(){
            let n = parseInt(document.getElementById('n').value);
            
            if(isNaN(n)){
                document.getElementById('numeros').innerHTML = 'Nenhum valor digitado';
                return;
            }

            let s = "";

            let inc = n%2 ? 1 : 2;

            for(let i = 0; i<10; i++){
                n+=inc;
                s+=n+"<br/>";
            }

            document.getElementById('numeros').innerHTML = s;
        }
    </script>
</body>
</html>
