<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <fieldset>
        <form name="opera_form" method="post">
            <table>
                <tr>
                    <td width="33%" align="right" valign="middle"><label>Name (required)</label></td>
                    <td>
                        <input name="name" type="text" autofocus required/>
                    </td>
                    <td width="33%"valign="top" align="right">
                        <img src="opera.png" height="32" alt="opera_logo">
                    </td>
                </tr>
                <tr>
                    <td align="right"><label for="title">Title</label></td>
                    <td>
                        <input name="title" type="text"/>
                    </td>
                </tr>
                <tr>
                    <td align="right"><label for="shoesize">Shoesize</label></td>
                    <td>
                        <input name="shoesize" type="number" max="0" min="99" size=""/>
                    </td>
                </tr>
                <tr>
                    <td align="right" for="email"><label>Email (required)</label></td>
                    <td>
                        <input name="email" type="email" required/>
                    </td>
                </tr>
                <tr>
                    <td align="right" for="webpage"><label>Webpage</label></td>
                    <td>
                        <input name="webpage" type="url" size="25">
                    </td>
                </tr>
                <tr>
                    <td align="right"><label for="date_birth">Date of Birth</label></td>
                    <td>
                        <input name="date_birth" type="date"/>
                    </td>
                </tr>
                <tr>
                    <td align="right"><label for="attractiveness">Attractiveness</label></td>
                    <td>
                        <input name="attractiveness" type="range"/>
                    </td>
                </tr>

            </table>
           
            <br>  
        </form>
    </div>
    
        
    </fieldset>
</body>
</html>
