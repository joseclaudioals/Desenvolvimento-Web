<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Shot de Aquarios</title>
</head>
<body>
        <form method="post" name="aquarioForm">
            <fieldset style="width: fit-content;">
                <legend>Informações do Aquário</legend>
                
                <label for="ph" >Ph do Aquário:</label> <br/>
                <input type="radio" name="ph" value="acido"> Ácido
                <input type="radio" name="ph" value="alcalino"> Alcalino
                <fieldset>
                    <legend>Peixes</legend>
                    <label for="qnt_peixes">Quantidade</label>
                    <input type="text" name="qnt_peixes" size="5px">
                    <br/>
                    <label>Espécie:</label>
                    <select>
                        <option value="espada">Espada</option>
                        <option value="molinesia">Molinésia</option>
                        <option value="plati">Plati</option>
                    </select>
                </fieldset>
                <label for="outros">Outros:</label> <br>
                <input type="checkbox" value="pedras"> pedras <br/>
                <input type="checkbox" value="plantas"> plantas
            </fieldset>
        </form>
</body>
</html>
